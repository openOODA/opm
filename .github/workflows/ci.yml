name: opm CI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Specific release tag to target or rebuild (optional, e.g. v0.8.13)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout opm
        uses: actions/checkout@v4
        with:
          path: opm
      - name: checkout std
        uses: actions/checkout@v4
        with:
          repository: openOODA/std
          path: std
      - name: checkout oodac
        uses: actions/checkout@v4
        with:
          repository: openOODA/oodac
          path: oodac
      - name: checkout oodar
        uses: actions/checkout@v4
        with:
          repository: openOODA/oodar
          path: oodar
      - name: require compiler
        run: |
          test -x oodac/bin/oodac || chmod +x oodac/bin/oodac
          test -f oodar/core/blackbox/blackbox.c || { echo "missing oodar/core/blackbox/blackbox.c"; exit 1; }
      - name: verify and test
        working-directory: ${{ github.workspace }}
        env:
          OODA_COMPILER: ${{ github.workspace }}/oodac/bin/oodac
          OODA_FS_READDIR: ${{ github.workspace }}
          OODA_FS_WRITEDIR: ${{ github.workspace }}
        run: |
          set -euo pipefail
          test ! -e opm/VERSION || { echo "ERR VERSION file is banned"; exit 1; }
          for f in opm/cli/cmd_more.oo opm/cli/host_build.oo opm/core/core.oo; do
            test ! -e "$f" || { echo "ERR banned file $f"; exit 1; }
          done
          ! grep -q "bin/oodac" opm/cli/find_compiler.oo || { echo "ERR find_compiler fallback"; exit 1; }
          ! grep -q "ooda/oodac_bin" opm/cli/find_compiler.oo || { echo "ERR find_compiler fallback"; exit 1; }
          for f in opm/cli/host_run.oo opm/cli/git_clone.oo opm/cli/reg_fetch.oo opm/cli/cmd_bot.oo opm/registry/regs.oo; do
            ! grep -q 'sys_exec(proc, "sh"' "$f" || { echo "ERR sh exec in $f"; exit 1; }
            ! grep -q "command -v" "$f" || { echo "ERR command -v in $f"; exit 1; }
          done
          for d in core resolve lock store registry policy sign launch qa cli; do
            test -f "opm/$d/anchor.oo" || test -f "opm/$d/anchor.oo" || { echo "ERR missing opm/$d/anchor.oo"; exit 1; }
          done
          echo "api_surface=10"
          for t in qa/today_proof.oo qa/tomorrow_proof.oo qa/extract_proof.oo qa/ingest_proof.oo qa/init_proof.oo qa/lock_format_proof.oo qa/pubgrub_proof.oo qa/semver_proof.oo qa/argv_init_proof.oo qa/argv_bot_proof.oo qa/argv_publish_proof.oo qa/help_surface_proof.oo qa/sbom_dispatch_proof.oo qa/compiler_token_proof.oo qa/no_shell_proof.oo qa/search_proof.oo registry/git_ingest_proof.oo registry/reg_proof.oo; do
            out=$("${OODA_COMPILER}" check "opm/$t") || { echo "$out"; exit 1; }
            case "$out" in *ERR*) echo "ERR in stdout opm/$t: $out"; exit 1;; esac
            out=$("${OODA_COMPILER}" check "opm/$t") || { echo "$out"; exit 1; }
            case "$out" in *ERR*) echo "ERR in stdout opm/$t: $out"; exit 1;; esac
          done
          echo "self-test passed"

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: checkout opm
        uses: actions/checkout@v4
        with:
          path: opm
      - name: checkout std
        uses: actions/checkout@v4
        with:
          repository: openOODA/std
          path: std
      - name: checkout oodac
        uses: actions/checkout@v4
        with:
          repository: openOODA/oodac
          path: oodac
      - name: checkout oodar
        uses: actions/checkout@v4
        with:
          repository: openOODA/oodar
          path: oodar
      - name: require compiler
        run: |
          test -x oodac/bin/oodac || chmod +x oodac/bin/oodac
          test -f oodar/core/blackbox/blackbox.c || { echo "missing oodar/core/blackbox/blackbox.c"; exit 1; }
      - name: build native binary
        working-directory: ${{ github.workspace }}
        env:
          OODA_COMPILER: ${{ github.workspace }}/oodac/bin/oodac
          OODA_FS_READDIR: ${{ github.workspace }}
          OODA_FS_WRITEDIR: ${{ github.workspace }}
        run: |
          mkdir -p dist
          "${OODA_COMPILER}" build opm/cli/main.oo -o dist/opm-linux-x86_64
          chmod +x dist/opm-linux-x86_64
          (cd dist && sha256sum opm-linux-x86_64 > opm-linux-x86_64.sha256)
          ls -lh dist/
      - name: upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-linux-x86_64
          path: dist/
          if-no-files-found: error

  blackbox-gate:
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: checkout opm
        uses: actions/checkout@v4
        with:
          path: opm
      - name: checkout std
        uses: actions/checkout@v4
        with:
          repository: openOODA/std
          path: std
      - name: checkout oodac
        uses: actions/checkout@v4
        with:
          repository: openOODA/oodac
          path: oodac
      - name: checkout oodar
        uses: actions/checkout@v4
        with:
          repository: openOODA/oodar
          path: oodar
      - name: require compiler
        run: |
          test -x oodac/bin/oodac || chmod +x oodac/bin/oodac
          test -f oodar/core/blackbox/blackbox.c || { echo "missing oodar/core/blackbox/blackbox.c"; exit 1; }
      - name: install blackbox (download prebuilt from GitHub release)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.openooda/bin"
          curl -fsSL -o "$HOME/.openooda/bin/blackbox" \
            "https://github.com/openOODA/bb/releases/download/v0.0.10/blackbox-linux-x86_64"
          curl -fsSL -o "$HOME/.openooda/bin/blackbox.sha256" \
            "https://github.com/openOODA/bb/releases/download/v0.0.10/blackbox-linux-x86_64.sha256"
          expected=$(cut -d' ' -f1 "$HOME/.openooda/bin/blackbox.sha256")
          actual=$(sha256sum "$HOME/.openooda/bin/blackbox" | cut -d' ' -f1)
          test "$expected" = "$actual" || { echo "[blackbox-gate FAIL] sha256 mismatch"; exit 1; }
          chmod +x "$HOME/.openooda/bin/blackbox"
      - name: blackbox double-run on qa/ probes (RULES §1.10)
        working-directory: ${{ github.workspace }}/opm
        env:
          OODA_FS_READDIR: ${{ github.workspace }}
          OODA_FS_WRITEDIR: ${{ github.workspace }}
          OODA_NO_JAIL: '1'
          OODA_COMPILER: ${{ github.workspace }}/oodac/bin/oodac
        run: |
          set -euo pipefail
          trap 'rm -f /tmp/*.diff[12] /tmp/flight.trace[12]' EXIT
          shopt -s nullglob
          count=0
          for f in qa/probe_*.oo qa/*_proof.oo; do
            test -f "$f" || continue
            count=$((count + 1))
            base=$(basename "$f" .oo)
            ~/.openooda/bin/blackbox diff "$f" > "/tmp/${base}.diff1" 2>&1 || {
              echo "[blackbox-gate FAIL] diff non-zero exit on $f"
              exit 1
            }
            ~/.openooda/bin/blackbox diff "$f" > "/tmp/${base}.diff2" 2>&1 || {
              echo "[blackbox-gate FAIL] second diff non-zero exit on $f"
              exit 1
            }
            if ! diff -q "/tmp/${base}.diff1" "/tmp/${base}.diff2" >/dev/null; then
              echo "[blackbox-gate FAIL] non-deterministic diff on $f (double-run law violation, RULES §1.10)"
              diff "/tmp/${base}.diff1" "/tmp/${base}.diff2" | head -20
              exit 1
            fi
          done
          if [ "$count" -eq 0 ]; then
            echo "[blackbox-gate SKIP] no qa unit files in this repo"
            exit 0
          fi
          if [ -s .blackbox/flight.json ]; then
            ~/.openooda/bin/blackbox trace > /tmp/flight.trace1 2>&1 || {
              echo "[blackbox-gate FAIL] unreadable flight log"
              exit 1
            }
            ~/.openooda/bin/blackbox trace > /tmp/flight.trace2 2>&1 || {
              echo "[blackbox-gate FAIL] unreadable flight log on second read"
              exit 1
            }
            if ! diff -q /tmp/flight.trace1 /tmp/flight.trace2 >/dev/null; then
              echo "[blackbox-gate FAIL] non-deterministic flight trace"
              exit 1
            fi
            echo "[blackbox-gate OK] $count probes deterministic across double-run; flight log readable and deterministic"
          else
            echo "[blackbox-gate OK] $count probes deterministic across double-run; no flight log (no crashes recorded)"
          fi

  auto-release:
    needs: [build, blackbox-gate]
    uses: openOODA/openOODA/.github/workflows/auto-release.yml@v2.10.23
    with:
      artifact_pattern: 'release-assets-*'
      target_tag: ${{ inputs.target_tag || '' }}
